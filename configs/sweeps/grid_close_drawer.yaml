# 3x3 grid over Drawer x Robot (generated by relevance.grid)
out_dir: runs/grid_close_drawer
env:
  horizon: 200
  obs_keys:
  - robot0_proprio
  - object-state
  - task-state
ppo:
  total_timesteps: 300000
  n_envs: 4
  n_steps: 512
  batch_size: 512
  checkpoint_every: 100000
  device: cpu
eval:
  episodes: 20
sweep:
  tasks:
  - close_drawer
  relevance:
  - grid_000_000
  - grid_000_050
  - grid_000_100
  - grid_050_000
  - grid_050_050
  - grid_050_100
  - grid_100_000
  - grid_100_050
  - grid_100_100
  seeds:
  - 0
